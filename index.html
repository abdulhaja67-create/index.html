<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdel War Zone</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    user-select: none;
}

canvas {
    display: block;
}

#menu,
#gameOver {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.78);
    color: white;
}

.box {
    width: min(90%, 500px);
    padding: 35px;
    background: rgba(20,25,20,.97);
    border: 2px solid #59694f;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,0,0,.8);
}

h1 {
    font-size: 40px;
    margin-bottom: 12px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

input,
select,
button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

button {
    background: #4d7c35;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #639b43;
}

#gameOver {
    display: none;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 5;
    color: white;
    background: rgba(0,0,0,.60);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 17px;
    line-height: 1.7;
    min-width: 180px;
}

.healthBox {
    width: 160px;
    height: 14px;
    background: #333;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 4px;
}

#healthBar {
    height: 100%;
    width: 100%;
    background: #28c840;
    transition: width .15s;
}

#crosshair {
    position: fixed;
    pointer-events: none;
    z-index: 6;
    width: 24px;
    height: 24px;
    border: 2px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

#help {
    position: fixed;
    bottom: 15px;
    left: 15px;
    color: white;
    background: rgba(0,0,0,.5);
    padding: 8px 12px;
    border-radius: 8px;
    z-index: 5;
    font-size: 13px;
}

#reloadText {
    color: #ffd84d;
}
</style>
</head>

<body>

<div id="menu">
    <div class="box">
        <h1>⚔️ Abdel War Zone</h1>
        <div class="subtitle">2D Third-Person Battle</div>

        <input id="playerName" placeholder="Enter your name">

        <select id="country">
            <option value="🇩🇪">🇩🇪 Germany</option>
            <option value="🇸🇾">🇸🇾 Syria</option>
            <option value="🇺🇸">🇺🇸 USA</option>
            <option value="🇬🇧">🇬🇧 United Kingdom</option>
            <option value="🇫🇷">🇫🇷 France</option>
            <option value="🇹🇷">🇹🇷 Turkey</option>
        </select>

        <select id="difficulty">
            <option value="easy">🟢 Easy Bots</option>
            <option value="medium">🟡 Medium Bots</option>
            <option value="hard">🔴 Hard Bots</option>
        </select>

        <button onclick="startGame()">START GAME</button>
    </div>
</div>


<div id="hud">

    <div id="playerInfo">🇩🇪 Player</div>

    ❤️ HP:
    <span id="hp">200</span> / 200

    <div class="healthBox">
        <div id="healthBar"></div>
    </div>

    🔫 Ammo:
    <span id="ammo">30</span>

    <span id="reloadText"></span>

    <br>

    ☠️ Kills:
    <span id="kills">0</span>

    <br>

    ⭐ Score:
    <span id="score">0</span>

</div>


<div id="help">
    WASD = Move | Mouse = Aim | Left Click = Shoot | R = Reload
</div>


<div id="crosshair"></div>


<div id="gameOver">

    <div class="box">

        <h1>💀 GAME OVER</h1>

        <p id="finalScore"></p>

        <button onclick="restartGame()">
            PLAY AGAIN
        </button>

        <button onclick="backToMenu()">
            MENU
        </button>

    </div>

</div>


<canvas id="game"></canvas>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W;
let H;

function resize() {

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

window.addEventListener("resize", resize);

resize();


// ==========================
// GAME
// ==========================

let running = false;

let playerName = "Abdel";
let playerFlag = "🇩🇪";
let difficulty = "easy";

let score = 0;
let kills = 0;

let keys = {};

let bullets = [];
let enemies = [];
let obstacles = [];
let particles = [];


// ==========================
// CAMERA
// ==========================

const camera = {

    x: 0,
    y: 0

};


// ==========================
// WORLD
// ==========================

const world = {

    width: 3000,
    height: 2200

};


// ==========================
// PLAYER
// ==========================

const player = {

    x: world.width / 2,
    y: world.height / 2,

    speed: 4,

    hp: 200,
    maxHp: 200,

    ammo: 30,
    maxAmmo: 30,

    reloadTime: 0,

    shootCooldown: 0,

    angle: 0

};


// ==========================
// MOUSE
// ==========================

const mouse = {

    x: W / 2,
    y: H / 2,

    down: false

};


// ==========================
// KEYBOARD
// ==========================

window.addEventListener("keydown", function(e) {

    keys[e.key.toLowerCase()] = true;

    if (e.key.toLowerCase() === "r") {

        reload();

    }

});

window.addEventListener("keyup", function(e) {

    keys[e.key.toLowerCase()] = false;

});


canvas.addEventListener("mousemove", function(e) {

    mouse.x = e.clientX;
    mouse.y = e.clientY;

    const crosshair =
        document.getElementById("crosshair");

    crosshair.style.left =
        mouse.x + "px";

    crosshair.style.top =
        mouse.y + "px";

});


canvas.addEventListener("mousedown", function() {

    mouse.down = true;

});


window.addEventListener("mouseup", function() {

    mouse.down = false;

});


// ==========================
// START
// ==========================

function startGame() {

    playerName =
        document.getElementById("playerName")
        .value.trim() || "Abdel";

    playerFlag =
        document.getElementById("country").value;

    difficulty =
        document.getElementById("difficulty").value;

    score = 0;
    kills = 0;

    player.hp = 200;
    player.ammo = 30;

    player.reloadTime = 0;

    player.x =
        world.width / 2;

    player.y =
        world.height / 2;

    bullets = [];
    enemies = [];
    obstacles = [];
    particles = [];

    createObstacles();

    createEnemies();

    document.getElementById("playerInfo")
        .innerText =
        playerFlag + " " + playerName;

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("gameOver")
        .style.display = "none";

    running = true;

    requestAnimationFrame(gameLoop);

}


// ==========================
// OBSTACLES
// ==========================

function createObstacles() {

    for (let i = 0; i < 80; i++) {

        const type =
            Math.random() < .6
            ? "tree"
            : "rock";

        const radius =
            type === "tree"
            ? 38
            : 30;

        let x;
        let y;

        do {

            x =
                100 +
                Math.random() *
                (world.width - 200);

            y =
                100 +
                Math.random() *
                (world.height - 200);

        } while (
            distance(
                x,
                y,
                player.x,
                player.y
            ) < 300
        );

        obstacles.push({

            x: x,
            y: y,

            radius: radius,

            type: type

        });

    }

}


// ==========================
// ENEMIES
// ==========================

function createEnemies() {

    for (let i = 0; i < 10; i++) {

        let x;
        let y;

        do {

            x =
                100 +
                Math.random() *
                (world.width - 200);

            y =
                100 +
                Math.random() *
                (world.height - 200);

        } while (

            distance(
                x,
                y,
                player.x,
                player.y
            ) < 500

            ||

            insideObstacle(
                x,
                y,
                30
            )

        );

        enemies.push({

            x: x,
            y: y,

            hp: 100,
            maxHp: 100,

            speed:
                difficulty === "hard"
                ? 2
                : difficulty === "medium"
                ? 1.5
                : 1.1,

            angle: 0,

            shootTimer:
                Math.random() * 100,

            alive: true

        });

    }

}


// ==========================
// PLAYER MOVEMENT
// ==========================

function updatePlayer() {

    let dx = 0;
    let dy = 0;

    if (
        keys["w"] ||
        keys["arrowup"]
    )
        dy--;

    if (
        keys["s"] ||
        keys["arrowdown"]
    )
        dy++;

    if (
        keys["a"] ||
        keys["arrowleft"]
    )
        dx--;

    if (
        keys["d"] ||
        keys["arrowright"]
    )
        dx++;


    if (dx !== 0 || dy !== 0) {

        const len =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        dx /= len;
        dy /= len;


        const newX =
            player.x +
            dx * player.speed;

        const newY =
            player.y +
            dy * player.speed;


        if (
            !insideObstacle(
                newX,
                player.y,
                24
            )
        ) {

            player.x = newX;

        }


        if (
            !insideObstacle(
                player.x,
                newY,
                24
            )
        ) {

            player.y = newY;

        }

    }


    player.x =
        Math.max(
            30,
            Math.min(
                world.width - 30,
                player.x
            )
        );


    player.y =
        Math.max(
            30,
            Math.min(
                world.height - 30,
                player.y
            )
        );


    // CAMERA FOLLOWS PLAYER

    camera.x =
        player.x -
        W / 2;

    camera.y =
        player.y -
        H / 2;


    camera.x =
        Math.max(
            0,
            Math.min(
                world.width - W,
                camera.x
            )
        );


    camera.y =
        Math.max(
            0,
            Math.min(
                world.height - H,
                camera.y
            )
        );


    // AIM

    const screenX =
        player.x -
        camera.x;

    const screenY =
        player.y -
        camera.y;


    player.angle =
        Math.atan2(
            mouse.y - screenY,
            mouse.x - screenX
        );

}


// ==========================
// SHOOT
// ==========================

function shoot() {

    if (!running)
        return;

    if (player.reloadTime > 0)
        return;

    if (player.shootCooldown > 0)
        return;

    if (player.ammo <= 0) {

        reload();

        return;

    }


    player.ammo--;

    player.shootCooldown = 9;


    const gunLength = 70;


    bullets.push({

        x:
            player.x +
            Math.cos(player.angle) *
            gunLength,

        y:
            player.y +
            Math.sin(player.angle) *
            gunLength,

        vx:
            Math.cos(player.angle) *
            11,

        vy:
            Math.sin(player.angle) *
            11,

        owner: "player",

        life: 100

    });


    muzzleFlash(

        player.x +
        Math.cos(player.angle) *
        65,

        player.y +
        Math.sin(player.angle) *
        65

    );

}


// ==========================
// RELOAD
// ==========================

function reload() {

    if (
        player.ammo ===
        player.maxAmmo
    )
        return;

    if (player.reloadTime > 0)
        return;

    player.reloadTime = 80;

}


// ==========================
// ENEMY AI
// ==========================

function updateEnemies() {

    for (const enemy of enemies) {

        if (!enemy.alive)
            continue;


        const dx =
            player.x -
            enemy.x;

        const dy =
            player.y -
            enemy.y;

        const dist =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        enemy.angle =
            Math.atan2(
                dy,
                dx
            );


        if (dist > 230) {

            const nx =
                dx / dist;

            const ny =
                dy / dist;


            const newX =
                enemy.x +
                nx * enemy.speed;

            const newY =
                enemy.y +
                ny * enemy.speed;


            if (
                !insideObstacle(
                    newX,
                    enemy.y,
                    23
                )
            )
                enemy.x = newX;


            if (
                !insideObstacle(
                    enemy.x,
                    newY,
                    23
                )
            )
                enemy.y = newY;

        }


        enemy.shootTimer--;


        if (
            dist < 650 &&
            enemy.shootTimer <= 0
        ) {

            enemyShoot(enemy);


            if (difficulty === "easy")
                enemy.shootTimer = 110;

            if (difficulty === "medium")
                enemy.shootTimer = 75;

            if (difficulty === "hard")
                enemy.shootTimer = 45;

        }

    }

}


// ==========================
// ENEMY SHOOT
// ==========================

function enemyShoot(enemy) {

    let accuracy;

    if (difficulty === "easy")
        accuracy = .30;

    if (difficulty === "medium")
        accuracy = .60;

    if (difficulty === "hard")
        accuracy = .88;


    const angle =
        enemy.angle +
        (Math.random() - .5) *
        (1 - accuracy);


    bullets.push({

        x:
            enemy.x +
            Math.cos(angle) *
            55,

        y:
            enemy.y +
            Math.sin(angle) *
            55,

        vx:
            Math.cos(angle) * 7,

        vy:
            Math.sin(angle) * 7,

        owner: "enemy",

        life: 100

    });

}


// ==========================
// BULLETS
// ==========================

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const b = bullets[i];


        b.x += b.vx;
        b.y += b.vy;

        b.life--;


        if (
            b.life <= 0 ||
            b.x < 0 ||
            b.y < 0 ||
            b.x > world.width ||
            b.y > world.height
        ) {

            bullets.splice(i, 1);

            continue;

        }


        // HIT TREE / ROCK

        if (
            insideObstacle(
                b.x,
                b.y,
                3
            )
        ) {

            createHitParticles(
                b.x,
                b.y
            );

            bullets.splice(i, 1);

            continue;

        }


        // PLAYER BULLET HITS ENEMY

        if (b.owner === "player") {

            for (const enemy of enemies) {

                if (!enemy.alive)
                    continue;


                // BODY HIT

                if (
                    distance(
                        b.x,
                        b.y,
                        enemy.x,
                        enemy.y
                    ) < 27
                ) {

                    let damage = 20;


                    // HEAD HIT

                    const headDistance =
                        distance(
                            b.x,
                            b.y,
                            enemy.x,
                            enemy.y - 38
                        );


                    if (
                        headDistance < 17
                    ) {

                        damage = 50;

                        createHitParticles(
                            enemy.x,
                            enemy.y - 38
                        );

                    } else {

                        createHitParticles(
                            enemy.x,
                            enemy.y
                        );

                    }


                    enemy.hp -= damage;


                    bullets.splice(
                        i,
                        1
                    );


                    if (
                        enemy.hp <= 0
                    ) {

                        enemy.hp = 0;

                        enemy.alive = false;

                        kills++;

                        score += 100;

                        explosion(
                            enemy.x,
                            enemy.y
                        );

                    }


                    break;

                }

            }

        }


        // ENEMY BULLET HITS PLAYER

        if (b.owner === "enemy") {

            if (
                distance(
                    b.x,
                    b.y,
                    player.x,
                    player.y
                ) < 28
            ) {

                player.hp -= 10;


                createHitParticles(
                    player.x,
                    player.y
                );


                bullets.splice(
                    i,
                    1
                );


                if (
                    player.hp <= 0
                ) {

                    player.hp = 0;

                    endGame();

                }

            }

        }

    }

}


// ==========================
// COLLISION
// ==========================

function insideObstacle(
    x,
    y,
    extra = 0
) {

    for (
        const o of obstacles
    ) {

        if (
            distance(
                x,
                y,
                o.x,
                o.y
            )
            <
            o.radius + extra
        ) {

            return true;

        }

    }

    return false;

}


function distance(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x1 - x2;

    const dy =
        y1 - y2;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


// ==========================
// WORLD
// ==========================

function drawWorld() {

    ctx.fillStyle =
        "#71815a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.save();


    ctx.translate(
        -camera.x,
        -camera.y
    );


    // GROUND

    ctx.fillStyle =
        "#71815a";

    ctx.fillRect(
        0,
        0,
        world.width,
        world.height
    );


    // GRASS

    ctx.strokeStyle =
        "rgba(30,60,20,.18)";


    for (
        let x = 0;
        x < world.width;
        x += 70
    ) {

        for (
            let y = 0;
            y < world.height;
            y += 70
        ) {

            ctx.beginPath();

            ctx.moveTo(
                x,
                y
            );

            ctx.lineTo(
                x + 5,
                y - 8
            );

            ctx.stroke();

        }

    }


    for (
        const o of obstacles
    ) {

        if (
            o.type === "tree"
        )
            drawTree(o);
        else
            drawRock(o);

    }


    ctx.restore();

}


// ==========================
// TREE
// ==========================

function drawTree(o) {

    // SHADOW

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        o.x,
        o.y + 20,
        48,
        18,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // TRUNK

    ctx.fillStyle =
        "#60452d";

    ctx.fillRect(
        o.x - 10,
        o.y - 5,
        20,
        45
    );


    // TREE

    ctx.fillStyle =
        "#254a25";

    ctx.beginPath();

    ctx.arc(
        o.x,
        o.y - 20,
        32,
        0,
        Math.PI * 2
    );

    ctx.arc(
        o.x - 22,
        o.y,
        27,
        0,
        Math.PI * 2
    );

    ctx.arc(
        o.x + 22,
        o.y,
        27,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#477b38";

    ctx.beginPath();

    ctx.arc(
        o.x - 5,
        o.y - 30,
        20,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// ==========================
// ROCK
// ==========================

function drawRock(o) {

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        o.x,
        o.y + 10,
        34,
        15,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#64635c";

    ctx.beginPath();

    ctx.moveTo(
        o.x - 27,
        o.y + 8
    );

    ctx.lineTo(
        o.x - 31,
        o.y - 8
    );

    ctx.lineTo(
        o.x - 13,
        o.y - 25
    );

    ctx.lineTo(
        o.x + 12,
        o.y - 23
    );

    ctx.lineTo(
        o.x + 30,
        o.y - 5
    );

    ctx.lineTo(
        o.x + 20,
        o.y + 15
    );

    ctx.lineTo(
        o.x - 10,
        o.y + 20
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#858278";

    ctx.beginPath();

    ctx.moveTo(
        o.x - 12,
        o.y - 22
    );

    ctx.lineTo(
        o.x + 12,
        o.y - 20
    );

    ctx.lineTo(
        o.x + 5,
        o.y - 5
    );

    ctx.lineTo(
        o.x - 15,
        o.y - 8
    );

    ctx.closePath();

    ctx.fill();

}


// ==========================
// PLAYER
// ==========================

function drawPlayer() {

    const x = player.x;
    const y = player.y;


    ctx.save();

    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        player.angle
    );


    // SHADOW

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        20,
        30,
        14,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // LEGS

    ctx.fillStyle =
        "#263126";

    ctx.fillRect(
        -16,
        4,
        12,
        30
    );

    ctx.fillRect(
        4,
        4,
        12,
        30
    );


    // BOOTS

    ctx.fillStyle =
        "#151515";

    ctx.fillRect(
        -19,
        28,
        16,
        9
    );

    ctx.fillRect(
        3,
        28,
        16,
        9
    );


    // BODY

    ctx.fillStyle =
        "#344632";

    ctx.fillRect(
        -22,
        -18,
        44,
        36
    );


    // VEST

    ctx.fillStyle =
        "#52614a";

    ctx.fillRect(
        -16,
        -11,
        32,
        8
    );

    ctx.fillRect(
        -16,
        1,
        32,
        8
    );


    // ARMS

    ctx.strokeStyle =
        "#394837";

    ctx.lineWidth = 12;


    ctx.beginPath();

    ctx.moveTo(
        -18,
        -8
    );

    ctx.lineTo(
        -35,
        4
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        18,
        -8
    );

    ctx.lineTo(
        35,
        4
    );

    ctx.stroke();


    // HANDS

    ctx.fillStyle =
        "#c58d68";


    ctx.beginPath();

    ctx.arc(
        -36,
        5,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        36,
        5,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // NECK

    ctx.fillStyle =
        "#bd805d";

    ctx.fillRect(
        -7,
        -27,
        14,
        10
    );


    // HEAD / FACE

    ctx.fillStyle =
        "#c58d68";

    ctx.beginPath();

    ctx.arc(
        0,
        -39,
        17,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // HAIR

    ctx.fillStyle =
        "#29231d";

    ctx.beginPath();

    ctx.arc(
        0,
        -45,
        15,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    // HELMET

    ctx.fillStyle =
        "#46583d";

    ctx.beginPath();

    ctx.arc(
        0,
        -44,
        19,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    // GUN

    ctx.fillStyle =
        "#202020";

    ctx.fillRect(
        12,
        -3,
        58,
        8
    );


    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        65,
        -5,
        18,
        5
    );


    // MUZZLE

    ctx.fillStyle =
        "#333";

    ctx.fillRect(
        81,
        -4,
        5,
        7
    );


    ctx.restore();

}


// ==========================
// ENEMY
// ==========================

function drawEnemy(enemy) {

    if (!enemy.alive)
        return;


    const x = enemy.x;
    const y = enemy.y;


    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        enemy.angle
    );


    // SHADOW

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        20,
        30,
        14,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // LEGS

    ctx.fillStyle =
        "#292b30";

    ctx.fillRect(
        -16,
        4,
        12,
        30
    );

    ctx.fillRect(
        4,
        4,
        12,
        30
    );


    // BODY

    ctx.fillStyle =
        "#454b55";

    ctx.fillRect(
        -22,
        -18,
        44,
        36
    );


    // ARMS

    ctx.strokeStyle =
        "#505762";

    ctx.lineWidth = 12;


    ctx.beginPath();

    ctx.moveTo(
        -18,
        -8
    );

    ctx.lineTo(
        -35,
        4
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        18,
        -8
    );

    ctx.lineTo(
        35,
        4
    );

    ctx.stroke();


    // HANDS

    ctx.fillStyle =
        "#b87958";


    ctx.beginPath();

    ctx.arc(
        -36,
        5,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        36,
        5,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // HEAD

    ctx.fillStyle =
        "#b87958";

    ctx.beginPath();

    ctx.arc(
        0,
        -39,
        17,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // HELMET

    ctx.fillStyle =
        "#673636";

    ctx.beginPath();

    ctx.arc(
        0,
        -44,
        19,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    // GUN

    ctx.fillStyle =
        "#181818";

    ctx.fillRect(
        12,
        -3,
        58,
        8
    );


    ctx.fillRect(
        65,
        -5,
        18,
        5
    );


    ctx.restore();


    // ======================
    // ENEMY HP BAR
    // ======================

    const barWidth = 55;

    const screenX =
        enemy.x -
        camera.x;

    const screenY =
        enemy.y -
        camera.y;


    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        screenX -
        barWidth / 2,

        screenY - 78,

        barWidth,
        7
    );


    ctx.fillStyle =
        "#e33";

    ctx.fillRect(
        screenX -
        barWidth / 2,

        screenY - 78,

        barWidth *
        (enemy.hp /
        enemy.maxHp),

        7
    );


    // NAME

    ctx.fillStyle =
        "white";

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "BOT",
        screenX,
        screenY - 85
    );

}


// ==========================
// BULLETS
// ==========================

function drawBullets() {

    for (
        const b of bullets
    ) {

        ctx.save();

        ctx.translate(
            b.x - camera.x,
            b.y - camera.y
        );


        ctx.fillStyle =
            b.owner === "player"
            ? "#ffe86b"
            : "#ff5555";


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.restore();

    }

}


// ==========================
// PARTICLES
// ==========================

function createHitParticles(
    x,
    y
) {

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        particles.push({

            x: x,
            y: y,

            vx:
                (Math.random() - .5)
                * 5,

            vy:
                (Math.random() - .5)
                * 5,

            life: 25

        });

    }

}


function explosion(
    x,
    y
) {

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        particles.push({

            x: x,
            y: y,

            vx:
                (Math.random() - .5)
                * 8,

            vy:
                (Math.random() - .5)
                * 8,

            life: 50

        });

    }

}


function muzzleFlash(
    x,
    y
) {

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        particles.push({

            x: x,
            y: y,

            vx:
                (Math.random() - .5)
                * 3,

            vy:
                (Math.random() - .5)
                * 3,

            life: 12

        });

    }

}


function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;
        p.y += p.vy;

        p.life--;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }

    }

}


function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.fillStyle =
            "rgba(255,220,100,.85)";


        ctx.beginPath();

        ctx.arc(
            p.x - camera.x,
            p.y - camera.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


// ==========================
// HUD
// ==========================

function updateHUD() {

    document.getElementById("hp")
        .innerText =
        Math.max(
            0,
            Math.floor(player.hp)
        );


    document.getElementById("ammo")
        .innerText =
        player.reloadTime > 0
        ? "..."
        : player.ammo;


    document.getElementById("kills")
        .innerText =
        kills;


    document.getElementById("score")
        .innerText =
        score;


    const percentage =
        (player.hp /
        player.maxHp) *
        100;


    document.getElementById(
        "healthBar"
    ).style.width =
        percentage + "%";


    if (
        player.reloadTime > 0
    ) {

        document.getElementById(
            "reloadText"
        ).innerText =
            " 🔄 Reloading";

    } else {

        document.getElementById(
            "reloadText"
        ).innerText =
            "";

    }

}


// ==========================
// GAME OVER
// ==========================

function endGame() {

    if (!running)
        return;


    running = false;


    document.getElementById(
        "finalScore"
    ).innerText =
        "Kills: " +
        kills +
        " | Score: " +
        score;


    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";

}


function restartGame() {

    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    startGame();

}


function backToMenu() {

    running = false;


    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";

}


// ==========================
// GAME LOOP
// ==========================

function gameLoop() {

    if (!running)
        return;


    updatePlayer();


    if (mouse.down)
        shoot();


    if (
        player.shootCooldown > 0
    )
        player.shootCooldown--;


    if (
        player.reloadTime > 0
    ) {

        player.reloadTime--;


        if (
            player.reloadTime === 0
        ) {

            player.ammo =
                player.maxAmmo;

        }

    }


    updateEnemies();

    updateBullets();

    updateParticles();


    drawWorld();


    for (
        const enemy of enemies
    ) {

        drawEnemy(enemy);

    }


    drawBullets();

    drawParticles();

    drawPlayer();

    updateHUD();


    requestAnimationFrame(
        gameLoop
    );

}

</script>
