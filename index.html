<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdel War Zone</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    user-select: none;
}

canvas {
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.8)),
        #26351f;
    color: white;
    z-index: 10;
}

.box {
    width: min(90%, 500px);
    padding: 35px;
    background: rgba(20,25,20,.95);
    border: 2px solid #59694f;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,0,0,.8);
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

input, select, button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

button {
    background: #4d7c35;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #639b43;
}

#gameOver {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.78);
    color: white;
    text-align: center;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 5;
    color: white;
    background: rgba(0,0,0,.55);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 17px;
    line-height: 1.6;
}

#crosshair {
    position: fixed;
    pointer-events: none;
    z-index: 6;
    width: 24px;
    height: 24px;
    border: 2px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

#help {
    position: fixed;
    bottom: 15px;
    left: 15px;
    color: white;
    background: rgba(0,0,0,.45);
    padding: 8px 12px;
    border-radius: 8px;
    z-index: 5;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="menu">
    <div class="box">
        <h1>⚔️ Abdel War Zone</h1>
        <div class="subtitle">Third-Person 2D Battle</div>

        <input id="playerName" placeholder="Enter your name">

        <select id="country">
            <option value="🇩🇪">🇩🇪 Germany</option>
            <option value="🇸🇾">🇸🇾 Syria</option>
            <option value="🇺🇸">🇺🇸 USA</option>
            <option value="🇬🇧">🇬🇧 United Kingdom</option>
            <option value="🇫🇷">🇫🇷 France</option>
            <option value="🇹🇷">🇹🇷 Turkey</option>
        </select>

        <select id="difficulty">
            <option value="easy">🟢 Easy Bots</option>
            <option value="medium">🟡 Medium Bots</option>
            <option value="hard">🔴 Hard Bots</option>
        </select>

        <button onclick="startGame()">START GAME</button>
    </div>
</div>

<div id="hud">
    <div id="playerInfo">Player</div>
    ❤️ HP: <span id="hp">100</span><br>
    🔫 Ammo: <span id="ammo">30</span><br>
    ☠️ Kills: <span id="kills">0</span>
</div>

<div id="help">
    WASD = Move &nbsp; | &nbsp; Mouse = Aim &nbsp; | &nbsp; Click = Shoot &nbsp; | &nbsp; R = Reload
</div>

<div id="crosshair"></div>

<div id="gameOver">
    <div class="box">
        <h1>💀 GAME OVER</h1>
        <p id="finalScore"></p>
        <button onclick="restartGame()">PLAY AGAIN</button>
        <button onclick="backToMenu()">MENU</button>
    </div>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


// ===============================
// GAME VARIABLES
// ===============================

let running = false;

let playerName = "";
let playerFlag = "🇩🇪";
let difficulty = "easy";

let score = 0;
let kills = 0;

let keys = {};

let mouse = {
    x: W / 2,
    y: H / 2,
    down: false
};

let camera = {
    x: 0,
    y: 0
};

const world = {
    width: 3000,
    height: 2200
};

let bullets = [];
let enemies = [];
let obstacles = [];
let particles = [];


// ===============================
// PLAYER
// ===============================

const player = {
    x: world.width / 2,
    y: world.height / 2,

    speed: 3.5,

    hp: 100,
    maxHp: 100,

    ammo: 30,
    maxAmmo: 30,

    reloadTime: 0,
    shootCooldown: 0,

    angle: 0
};


// ===============================
// CONTROLS
// ===============================

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (e.key.toLowerCase() === "r") {
        reload();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", e => {

    mouse.x = e.clientX;
    mouse.y = e.clientY;

    document.getElementById("crosshair").style.left =
        mouse.x + "px";

    document.getElementById("crosshair").style.top =
        mouse.y + "px";
});

canvas.addEventListener("mousedown", () => {
    mouse.down = true;
});

window.addEventListener("mouseup", () => {
    mouse.down = false;
});


// ===============================
// START GAME
// ===============================

function startGame() {

    playerName =
        document.getElementById("playerName").value.trim()
        || "Abdel";

    playerFlag =
        document.getElementById("country").value;

    difficulty =
        document.getElementById("difficulty").value;

    score = 0;
    kills = 0;

    player.hp = 100;
    player.ammo = 30;

    player.x = world.width / 2;
    player.y = world.height / 2;

    bullets = [];
    enemies = [];
    obstacles = [];
    particles = [];

    createObstacles();
    createEnemies();

    document.getElementById("playerInfo").innerText =
        playerFlag + " " + playerName;

    document.getElementById("menu").style.display = "none";
    document.getElementById("gameOver").style.display = "none";

    running = true;

    requestAnimationFrame(gameLoop);
}


// ===============================
// OBSTACLES
// ===============================

function createObstacles() {

    for (let i = 0; i < 80; i++) {

        let type = Math.random() < 0.6
            ? "tree"
            : "rock";

        let radius =
            type === "tree"
            ? 35
            : 28;

        let x, y;

        do {

            x = 100 + Math.random() * (world.width - 200);
            y = 100 + Math.random() * (world.height - 200);

        } while (
            distance(x, y, player.x, player.y) < 300
        );

        obstacles.push({
            x,
            y,
            radius,
            type
        });
    }
}


// ===============================
// ENEMIES
// ===============================

function createEnemies() {

    for (let i = 0; i < 10; i++) {

        let x, y;

        do {

            x = 100 + Math.random() * (world.width - 200);
            y = 100 + Math.random() * (world.height - 200);

        } while (
            distance(x, y, player.x, player.y) < 500 ||
            insideObstacle(x, y, 30)
        );

        enemies.push({

            x,
            y,

            hp: 100,

            speed:
                difficulty === "hard"
                ? 2.0
                : difficulty === "medium"
                ? 1.5
                : 1.1,

            angle: 0,

            shootTimer:
                Math.random() * 100,

            alive: true
        });
    }
}


// ===============================
// PLAYER MOVEMENT
// ===============================

function updatePlayer() {

    let dx = 0;
    let dy = 0;

    if (keys["w"] || keys["arrowup"])
        dy--;

    if (keys["s"] || keys["arrowdown"])
        dy++;

    if (keys["a"] || keys["arrowleft"])
        dx--;

    if (keys["d"] || keys["arrowright"])
        dx++;

    if (dx !== 0 || dy !== 0) {

        let length =
            Math.sqrt(dx * dx + dy * dy);

        dx /= length;
        dy /= length;

        let newX =
            player.x + dx * player.speed;

        let newY =
            player.y + dy * player.speed;

        if (!insideObstacle(newX, player.y, 25))
            player.x = newX;

        if (!insideObstacle(player.x, newY, 25))
            player.y = newY;
    }

    player.x =
        Math.max(30,
        Math.min(world.width - 30, player.x));

    player.y =
        Math.max(30,
        Math.min(world.height - 30, player.y));


    // Camera follows player

    camera.x =
        player.x - W / 2;

    camera.y =
        player.y - H / 2;

    camera.x =
        Math.max(0,
        Math.min(world.width - W, camera.x));

    camera.y =
        Math.max(0,
        Math.min(world.height - H, camera.y));


    // Aim

    let screenPlayerX =
        player.x - camera.x;

    let screenPlayerY =
        player.y - camera.y;

    player.angle =
        Math.atan2(
            mouse.y - screenPlayerY,
            mouse.x - screenPlayerX
        );
}


// ===============================
// SHOOTING
// ===============================

function shoot() {

    if (!running)
        return;

    if (player.reloadTime > 0)
        return;

    if (player.shootCooldown > 0)
        return;

    if (player.ammo <= 0) {

        reload();
        return;
    }

    player.ammo--;

    player.shootCooldown = 10;

    let gunLength = 38;

    bullets.push({

        x:
            player.x +
            Math.cos(player.angle) * gunLength,

        y:
            player.y +
            Math.sin(player.angle) * gunLength,

        vx:
            Math.cos(player.angle) * 10,

        vy:
            Math.sin(player.angle) * 10,

        owner: "player",

        life: 100
    });

    muzzleFlash(
        player.x +
        Math.cos(player.angle) * 42,

        player.y +
        Math.sin(player.angle) * 42
    );
}


function reload() {

    if (player.ammo === player.maxAmmo)
        return;

    if (player.reloadTime > 0)
        return;

    player.reloadTime = 80;
}


// ===============================
// ENEMY AI
// ===============================

function updateEnemies() {

    for (let enemy of enemies) {

        if (!enemy.alive)
            continue;

        let dx =
            player.x - enemy.x;

        let dy =
            player.y - enemy.y;

        let dist =
            Math.sqrt(dx * dx + dy * dy);

        enemy.angle =
            Math.atan2(dy, dx);

        if (dist > 230) {

            let nx = dx / dist;
            let ny = dy / dist;

            let newX =
                enemy.x + nx * enemy.speed;

            let newY =
                enemy.y + ny * enemy.speed;

            if (!insideObstacle(newX, enemy.y, 23))
                enemy.x = newX;

            if (!insideObstacle(enemy.x, newY, 23))
                enemy.y = newY;
        }

        enemy.shootTimer--;

        if (
            dist < 600 &&
            enemy.shootTimer <= 0
        ) {

            enemyShoot(enemy);

            if (difficulty === "easy")
                enemy.shootTimer = 100;

            if (difficulty === "medium")
                enemy.shootTimer = 70;

            if (difficulty === "hard")
                enemy.shootTimer = 45;
        }
    }
}


function enemyShoot(enemy) {

    let accuracy;

    if (difficulty === "easy")
        accuracy = 0.35;

    if (difficulty === "medium")
        accuracy = 0.65;

    if (difficulty === "hard")
        accuracy = 0.90;

    let angle =
        enemy.angle +
        (Math.random() - 0.5) *
        (1 - accuracy);

    bullets.push({

        x:
            enemy.x +
            Math.cos(angle) * 35,

        y:
            enemy.y +
            Math.sin(angle) * 35,

        vx:
            Math.cos(angle) * 7,

        vy:
            Math.sin(angle) * 7,

        owner: "enemy",

        life: 100
    });
}


// ===============================
// BULLETS
// ===============================

function updateBullets() {

    for (let i = bullets.length - 1; i >= 0; i--) {

        let b = bullets[i];

        b.x += b.vx;
        b.y += b.vy;

        b.life--;

        if (
            b.life <= 0 ||
            b.x < 0 ||
            b.y < 0 ||
            b.x > world.width ||
            b.y > world.height
        ) {

            bullets.splice(i, 1);
            continue;
        }

        // Bullet hits obstacle

        if (insideObstacle(b.x, b.y, 4)) {

            createHitParticles(b.x, b.y);

            bullets.splice(i, 1);
            continue;
        }


        // Player bullet

        if (b.owner === "player") {

            for (let enemy of enemies) {

                if (!enemy.alive)
                    continue;

                if (
                    distance(
                        b.x,
                        b.y,
                        enemy.x,
                        enemy.y
                    ) < 25
                ) {

                    enemy.hp -= 50;

                    createHitParticles(
                        enemy.x,
                        enemy.y
                    );

                    bullets.splice(i, 1);

                    if (enemy.hp <= 0) {

                        enemy.alive = false;

                        kills++;
                        score += 100;

                        explosion(
                            enemy.x,
                            enemy.y
                        );
                    }

                    break;
                }
            }
        }


        // Enemy bullet

        if (b.owner === "enemy") {

            if (
                distance(
                    b.x,
                    b.y,
                    player.x,
                    player.y
                ) < 24
            ) {

                player.hp -= 10;

                createHitParticles(
                    player.x,
                    player.y
                );

                bullets.splice(i, 1);

                if (player.hp <= 0) {
                    endGame();
                }
            }
        }
    }
}


// ===============================
// COLLISION
// ===============================

function insideObstacle(x, y, extra = 0) {

    for (let o of obstacles) {

        if (
            distance(
                x,
                y,
                o.x,
                o.y
            ) < o.radius + extra
        ) {

            return true;
        }
    }

    return false;
}


function distance(x1, y1, x2, y2) {

    let dx = x1 - x2;
    let dy = y1 - y2;

    return Math.sqrt(dx * dx + dy * dy);
}


// ===============================
// DRAW WORLD
// ===============================

function drawWorld() {

    ctx.fillStyle = "#66734d";
    ctx.fillRect(0, 0, W, H);

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    // Ground

    ctx.fillStyle = "#71815a";

    ctx.fillRect(
        0,
        0,
        world.width,
        world.height
    );


    // Grass details

    ctx.strokeStyle =
        "rgba(30,60,20,.15)";

    for (
        let x = 0;
        x < world.width;
        x += 80
    ) {

        for (
            let y = 0;
            y < world.height;
            y += 80
        ) {

            ctx.beginPath();

            ctx.moveTo(x, y);
            ctx.lineTo(x + 5, y - 8);

            ctx.stroke();
        }
    }


    // Obstacles

    for (let o of obstacles) {

        if (o.type === "tree")
            drawTree(o);

        else
            drawRock(o);
    }

    ctx.restore();
}


// ===============================
// TREE
// ===============================

function drawTree(o) {

    // Shadow

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        o.x,
        o.y + 18,
        45,
        18,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Trunk

    ctx.fillStyle = "#60452d";

    ctx.fillRect(
        o.x - 9,
        o.y - 10,
        18,
        45
    );


    // Leaves

    ctx.fillStyle = "#274d25";

    ctx.beginPath();
    ctx.arc(o.x, o.y - 15, 30, 0, Math.PI * 2);
    ctx.arc(o.x - 20, o.y, 25, 0, Math.PI * 2);
    ctx.arc(o.x + 20, o.y, 25, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#3e7133";

    ctx.beginPath();
    ctx.arc(o.x, o.y - 25, 20, 0, Math.PI * 2);
    ctx.fill();
}


// ===============================
// ROCK
// ===============================

function drawRock(o) {

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        o.x,
        o.y + 10,
        32,
        14,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#66645b";

    ctx.beginPath();

    ctx.moveTo(o.x - 25, o.y + 8);
    ctx.lineTo(o.x - 30, o.y - 8);
    ctx.lineTo(o.x - 12, o.y - 25);
    ctx.lineTo(o.x + 12, o.y - 23);
    ctx.lineTo(o.x + 30, o.y - 5);
    ctx.lineTo(o.x + 20, o.y + 15);
    ctx.lineTo(o.x - 10, o.y + 20);

    ctx.closePath();
    ctx.fill();


    ctx.fillStyle = "#858278";

    ctx.beginPath();

    ctx.moveTo(o.x - 12, o.y - 22);
    ctx.lineTo(o.x + 12, o.y - 20);
    ctx.lineTo(o.x + 5, o.y - 5);
    ctx.lineTo(o.x - 15, o.y - 8);

    ctx.closePath();

    ctx.fill();
}


// ===============================
// DRAW PLAYER
// ===============================

function drawPlayer() {

    let x = player.x;
    let y = player.y;

    ctx.save();

    ctx.translate(x, y);

    // Aim direction

    ctx.rotate(player.angle);


    // Shadow

    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        18,
        28,
        13,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Legs

    ctx.fillStyle = "#263126";

    ctx.fillRect(
        -16,
        5,
        12,
        28
    );

    ctx.fillRect(
        4,
        5,
        12,
        28
    );


    // Boots

    ctx.fillStyle = "#171717";

    ctx.fillRect(
        -18,
        28,
        15,
        8
    );

    ctx.fillRect(
        3,
        28,
        15,
        8
    );


    // Body / tactical vest

    ctx.fillStyle = "#334331";

    ctx.fillRect(
        -22,
        -18,
        44,
        35
    );


    // Vest plates

    ctx.fillStyle = "#4c5b46";

    ctx.fillRect(
        -16,
        -10,
        32,
        7
    );

    ctx.fillRect(
        -16,
        2,
        32,
        7
    );


    // Left arm

    ctx.strokeStyle = "#394837";
    ctx.lineWidth = 12;

    ctx.beginPath();

    ctx.moveTo(-18, -8);
    ctx.lineTo(-35, 5);

    ctx.stroke();


    // Right arm

    ctx.beginPath();

    ctx.moveTo(18, -8);
    ctx.lineTo(35, 5);

    ctx.stroke();


    // Hands

    ctx.fillStyle = "#c58d68";

    ctx.beginPath();
    ctx.arc(-36, 6, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(36, 6, 7, 0, Math.PI * 2);
    ctx.fill();


    // Neck

    ctx.fillStyle = "#bd805d";

    ctx.fillRect(
        -7,
        -25,
        14,
        10
    );


    // Head

    ctx.fillStyle = "#c58d68";

    ctx.beginPath();

    ctx.arc(
        0,
        -38,
        17,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Hair

    ctx.fillStyle = "#29231d";

    ctx.beginPath();

    ctx.arc(
        0,
        -44,
        15,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    // Helmet

    ctx.fillStyle = "#46583d";

    ctx.beginPath();

    ctx.arc(
        0,
        -43,
        19,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    // Gun

    ctx.fillStyle = "#202020";

    ctx.fillRect(
        12,
        -2,
        55,
        7
    );

    ctx.fillStyle = "#111";

    ctx.fillRect(
        55,
        -4,
        18,
        4
    );


    // Gun sight

    ctx.fillStyle = "#777";

    ctx.fillRect(
        30,
        -6,
        5,
        5
    );


    ctx.restore();
}


// ===============================
// DRAW ENEMY
// ===============================

function drawEnemy(enemy) {

    if (!enemy.alive)
        return;

    let x = enemy.x;
    let y = enemy.y;

    ctx.save();

    ctx.translate(x, y);

    ctx.rotate(enemy.angle);


    // Shadow

    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        18,
        28,
        13,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Legs

    ctx.fillStyle = "#292b30";

    ctx.fillRect(
        -16,
        5,
        12,
        28
    );

    ctx.fillRect(
        4,
        5,
        12,
        28
    );


    // Body

    ctx.fillStyle = "#454b55";

    ctx.fillRect(
        -22,
        -18,
        44,
        35
    );


    // Arms

    ctx.strokeStyle = "#505762";
    ctx.lineWidth = 12;

    ctx.beginPath();

    ctx.moveTo(-18, -8);
    ctx.lineTo(-35, 5);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(18, -8);
    ctx.lineTo(35, 5);

    ctx.stroke();


    // Hands

    ctx.fillStyle = "#b87958";

    ctx.beginPath();
    ctx.arc(-36, 6, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(36, 6, 7, 0, Math.PI * 2);
    ctx.fill();


    // Head

    ctx.fillStyle = "#b87958";

    ctx.beginPath();

    ctx.arc(
        0,
        -38,
        17,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Helmet

    ctx.fillStyle = "#5b3030";

    ctx.beginPath();

    ctx.arc(
        0,
        -43,
        19,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    // Gun

    ctx.fillStyle = "#181818";

    ctx.fillRect(
        12,
        -2,
        55,
        7
    );

    ctx.fillRect(
        55,
        -4,
        18,
        4
    );


    // Health bar

    ctx.rotate(-enemy.angle);

    ctx.fillStyle = "#222";

    ctx.fillRect(
        -25,
        -70,
        50,
        6
    );

    ctx.fillStyle = "#e33";

    ctx.fillRect(
        -25,
        -70,
        50 * (enemy.hp / 100),
        6
    );

    ctx.restore();
}


// ===============================
// DRAW BULLETS
// ===============================

function drawBullets() {

    for (let b of bullets) {

        ctx.save();

        ctx.translate(
            b.x - camera.x,
            b.y - camera.y
        );

        ctx.fillStyle =
            b.owner === "player"
            ? "#ffe86b"
            : "#ff5555";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


// ===============================
// PARTICLES
// ===============================

function createHitParticles(x, y) {

    for (let i = 0; i < 8; i++) {

        particles.push({

            x,
            y,

            vx:
                (Math.random() - .5) * 5,

            vy:
                (Math.random() - .5) * 5,

            life: 25
        });
    }
}


function explosion(x, y) {

    for (let i = 0; i < 30; i++) {

        particles.push({

            x,
            y,

            vx:
                (Math.random() - .5) * 8,

            vy:
                (Math.random() - .5) * 8,

            life: 50
        });
    }
}


function muzzleFlash(x, y) {

    for (let i = 0; i < 5; i++) {

        particles.push({

            x,
            y,

            vx:
                (Math.random() - .5) * 3,

            vy:
                (Math.random() - .5) * 3,

            life: 12
        });
    }
}


function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        let p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

        if (p.life <= 0)
            particles.splice(i, 1);
    }
}


function drawParticles() {

    for (let p of particles) {

        ctx.fillStyle =
            "rgba(255,220,100,.8)";

        ctx.beginPath();

        ctx.arc(
            p.x - camera.x,
            p.y - camera.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


// ===============================
// HUD
// ===============================

function updateHUD() {

    document.getElementById("hp").innerText =
        Math.max(0, Math.floor(player.hp));

    document.getElementById("ammo").innerText =
        player.reloadTime > 0
        ? "RELOADING..."
        : player.ammo;

    document.getElementById("kills").innerText =
        kills;
}


// ===============================
// GAME OVER
// ===============================

function endGame() {

    if (!running)
        return;

    running = false;

    document.getElementById("finalScore").innerText =
        "Kills: " + kills +
        " | Score: " + score;

    document.getElementById("gameOver").style.display =
        "flex";
}


function restartGame() {

    document.getElementById("gameOver").style.display =
        "none";

    startGame();
}


function backToMenu() {

    running = false;

    document.getElementById("gameOver").style.display =
        "none";

    document.getElementById("menu").style.display =
        "flex";
}


// ===============================
// MAIN LOOP
// ===============================

function gameLoop() {

    if (!running)
        return;

    updatePlayer();

    if (mouse.down)
        shoot();

    if (player.shootCooldown > 0)
        player.shootCooldown--;

    if (player.reloadTime > 0) {

        player.reloadTime--;

        if (player.reloadTime === 0)
            player.ammo = player.maxAmmo;
    }

    updateEnemies();
    updateBullets();
    updateParticles();

    drawWorld();

    // Draw enemies

    for (let enemy of enemies)
        drawEnemy(enemy);

    drawBullets();
    drawParticles();

    drawPlayer();

    updateHUD();

    requestAnimationFrame(gameLoop);
}

</script>
