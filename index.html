<html lang="en">
<head>

<title>Abdel War Zone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080b0f;
    color: white;
    overflow: hidden;
}

.screen {
    display: none;
    width: 100vw;
    height: 100vh;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.active {
    display: flex;
}

/* INTRO */

#intro {
    flex-direction: column;
    background:
        radial-gradient(circle at center, #263238, #080b0f 70%);
}

#intro h1 {
    font-size: clamp(40px, 8vw, 85px);
    margin: 0;
    animation: titleIn 1.5s ease;
}

#intro p {
    font-size: 22px;
    color: #aaa;
    animation: fade 2s ease;
}

@keyframes titleIn {
    from {
        opacity: 0;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes fade {
    from { opacity: 0; }

/* MENU */

#menu {

        linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.8)),

}

.panel {
    width: min(92vw, 500px);
    padding: 35px;

    background: rgba(10,10,10,.85);
    box-shadow: 0 0 40px rgba(0,0,0,.7);
}

input,
select {

button {

}

button:hover {

}

/* GAME */

#game {

#game.active {

}

canvas {

#hud {

#playerInfo {

#crosshair::before,
#crosshair::after {

#crosshair::before {

#controls {

/* GAME OVER */

#gameOver {

        radial-gradient(circle,#620000,#090000 70%);
}

#gameOver h1 {
    font-size: 70px;

}

.bigScore {
    font-size: 30px;
}

/* MOBILE */

@media (max-width: 700px) {

    #hud {
        font-size: 13px;
    }

    #playerInfo {
        font-size: 14px;
    }

    #healthBar {
        width: 90px;
    }

    .move {
        width: 52px;
        height: 52px;
    }
}
</style>

<body>

</div>


<!-- MENU -->

<div id="menu" class="screen">

    <div class="panel">

        >

        <select id="country">

            </option>

            <option value="🇮🇹 Italy">

            </option>

            <option value="🇪🇸 Spain">
                🇪🇸 Spain
            </option>

                🇹🇷 Turkey
            </option>

        </select>

        <select id="difficulty">

            <option value="easy">
                🟢 EASY
            </option>

            </option>

        </select>

            🚀 START BATTLE
        </button>

</div>


<!-- GAME -->

<div id="game" class="screen">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div id="playerInfo">
            🇩🇪 Abdel
        </div>

        <div>
            ❤️
            <div id="healthBar">
                <div id="health"></div>
            </div>
        </div>

        <div>
            🔫 Ammo:
            <span id="ammo">30</span>
        </div>

            <span id="score">0</span>
        </div>

        <div class="controlGroup">

            <button class="move"
                onclick="movePlayer('up')">

            </button>

            <br>

            <button class="move"
                onclick="movePlayer('left')">
                ⬅️
            </button>

            <button class="move"
                onclick="movePlayer('down')">
                ⬇️
            </button>

            <button class="move"
                onclick="movePlayer('right')">
                ➡️
            </button>

        </div>


        <div class="controlGroup">

            <button class="fire"
                onclick="shoot()">
                🔥 FIRE
            </button>

        </div>

    </div>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="screen">

    <h1>💀 GAME OVER</h1>

    <div class="bigScore">
        🏆 Score:
        <span id="finalScore">0</span>
    </div>

    <button onclick="restartGame()">
        🔄 PLAY AGAIN
    </button>

    <button onclick="goMenu()">
        🏠 MENU
    </button>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let player;

let enemies = [];

let bullets = [];

let particles = [];

let score = 0;

let ammo = 30;

let health = 100;

let difficulty = "easy";

let gameRunning = false;

let animation;


/* =========================
   INTRO
========================= */

setTimeout(() => {

    document
        .getElementById("intro")
        .classList.remove("active");

    document
        .getElementById("menu")
        .classList.add("active");

}, 2500);


/* =========================
   START GAME
========================= */

function startGame() {

    let name =
        document
        .getElementById("name")
        .value
        .trim();

    let country =
        document
        .getElementById("country")
        .value;

    difficulty =
        document
        .getElementById("difficulty")
        .value;


    if (!name) {

        alert("Enter your name!");

        return;
    }


    document.getElementById("playerInfo").innerText =
        country + " " + name;


    document
        .getElementById("menu")
        .classList.remove("active");

    document
        .getElementById("game")
        .classList.add("active");


    resizeCanvas();

    restartGame();
}


/* =========================
   RESIZE
========================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   RESTART
========================= */

function restartGame() {

    clearInterval(animation);

    resizeCanvas();

    score = 0;

    ammo = 30;

    health = 100;

    bullets = [];

    particles = [];

    enemies = [];


    player = {

        x: canvas.width / 2,

        y: canvas.height / 2,

        size: 22,

        speed: 7

    };


    document
        .getElementById("score")
        .innerText = score;

    document
        .getElementById("ammo")
        .innerText = ammo;

    updateHealth();


    /* CREATE BOTS */

    for (let i = 0; i < 6; i++) {

        createEnemy();

    }


    document
        .getElementById("gameOver")
        .classList.remove("active");

    document
        .getElementById("game")
        .classList.add("active");


    gameRunning = true;

    gameLoop();

}


/* =========================
   CREATE BOT
========================= */

function createEnemy() {

    let enemy = {

        x:
            Math.random() *
            canvas.width,

        y:
            Math.random() *
            canvas.height,

        size: 24,

        speed:
            difficulty === "easy"
            ? 1.1
            : difficulty === "medium"
            ? 1.7
            : 2.4,

        cooldown:
            Math.random() * 100

    };

    enemies.push(enemy);
}


/* =========================
   PLAYER MOVEMENT
========================= */

function movePlayer(direction) {

    if (!gameRunning) return;

    if (direction === "up")
        player.y -= player.speed;

    if (direction === "down")
        player.y += player.speed;

    if (direction === "left")
        player.x -= player.speed;

    if (direction === "right")
        player.x += player.speed;


    keepPlayerInside();
}


function keepPlayerInside() {

    player.x =
        Math.max(
            30,
            Math.min(
                canvas.width - 30,
                player.x
            )
        );

    player.y =
        Math.max(
            80,
            Math.min(
                canvas.height - 40,
                player.y
            )
        );
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "w" ||
            event.key === "ArrowUp")
            movePlayer("up");

        if (event.key === "s" ||
            event.key === "ArrowDown")
            movePlayer("down");

        if (event.key === "a" ||
            event.key === "ArrowLeft")
            movePlayer("left");

        if (event.key === "d" ||
            event.key === "ArrowRight")
            movePlayer("right");

        if (event.code === "Space")
            shoot();

    }
);


/* =========================
   SHOOT
========================= */

function shoot() {

    if (!gameRunning) return;

    if (ammo <= 0) return;


    ammo--;

    document
        .getElementById("ammo")
        .innerText = ammo;


    /*
       الرصاصة تتجه نحو
       أقرب بوت
    */

    let target = null;

    let bestDistance = Infinity;


    for (let enemy of enemies) {

        let distance =
            Math.hypot(
                enemy.x - player.x,
                enemy.y - player.y
            );


        if (distance < bestDistance) {

            bestDistance = distance;

            target = enemy;

        }
    }


    if (!target) return;


    let dx =
        target.x - player.x;

    let dy =
        target.y - player.y;

    let length =
        Math.hypot(dx, dy);


    bullets.push({

        x: player.x,

        y: player.y,

        vx: dx / length * 12,

        vy: dy / length * 12

    });

}


/* =========================
   BOT SHOOTING
========================= */

function botShoot(enemy) {

    /*
       Easy:
       البوت يطلق كثير لكن
       دقته ضعيفة

       Hard:
       البوت أدق
    */

    let accuracy;

    if (difficulty === "easy")
        accuracy = 0.18;

    if (difficulty === "medium")
        accuracy = 0.45;

    if (difficulty === "hard")
        accuracy = 0.80;


    if (Math.random() > accuracy)
        return;


    let dx =
        player.x - enemy.x;

    let dy =
        player.y - enemy.y;

    let distance =
        Math.hypot(dx, dy);


    if (distance === 0)
        return;


    let angle =
        Math.atan2(dy, dx);


    /*
       Easy = انحراف أكبر
       Hard = انحراف أقل
    */

    let spread =
        difficulty === "easy"
        ? 0.8
        : difficulty === "medium"
        ? 0.35
        : 0.12;


    angle +=
        (Math.random() - .5) *
        spread;


    bullets.push({

        x: enemy.x,

        y: enemy.y,

        vx: Math.cos(angle) * 6,

        vy: Math.sin(angle) * 6,

        enemyBullet: true

    });

}


/* =========================
   UPDATE
========================= */

function update() {

    if (!gameRunning)
        return;


    /* PLAYER BULLETS */

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        let bullet = bullets[i];


        bullet.x += bullet.vx;
        bullet.y += bullet.vy;


        /* OUTSIDE */

        if (
            bullet.x < 0 ||
            bullet.x > canvas.width ||
            bullet.y < 0 ||
            bullet.y > canvas.height
        ) {

            bullets.splice(i, 1);

            continue;
        }


        /* PLAYER BULLET HITS BOT */

        if (!bullet.enemyBullet) {

            for (
                let j = enemies.length - 1;
                j >= 0;
                j--
            ) {

                let enemy = enemies[j];


                let distance =
                    Math.hypot(
                        bullet.x - enemy.x,
                        bullet.y - enemy.y
                    );


                if (distance < 28) {

                    createExplosion(
                        enemy.x,
                        enemy.y
                    );


                    enemies.splice(j, 1);

                    bullets.splice(i, 1);

                    score += 100;


                    document
                        .getElementById("score")
                        .innerText = score;


                    createEnemy();

                    break;
                }
            }
        }


        /* BOT BULLET HITS PLAYER */

        else {

            let distance =
                Math.hypot(
                    bullet.x - player.x,
                    bullet.y - player.y
                );


            if (distance < 28) {

                health -=
                    difficulty === "easy"
                    ? 4
                    : difficulty === "medium"
                    ? 8
                    : 14;


                bullets.splice(i, 1);

                updateHealth();


                if (health <= 0) {

                    endGame();

                    return;
                }
            }
        }
    }


    /* BOT AI */

    for (let enemy of enemies) {

        let dx =
            player.x - enemy.x;

        let dy =
            player.y - enemy.y;

        let distance =
            Math.hypot(dx, dy);


        if (distance > 180) {

            enemy.x +=
                dx / distance *
                enemy.speed;

            enemy.y +=
                dy / distance *
                enemy.speed;

        }


        enemy.cooldown--;


        if (
            enemy.cooldown <= 0 &&
            distance < 700
        ) {

            botShoot(enemy);


            enemy.cooldown =
                difficulty === "easy"
                ? 120
                : difficulty === "medium"
                ? 80
                : 45;
        }
    }


    updateParticles();
}


/* =========================
   PARTICLES
========================= */

function createExplosion(x, y) {

    for (let i = 0; i < 18; i++) {

        particles.push({

            x: x,

            y: y,

            vx:
                (Math.random() - .5) * 8,

            vy:
                (Math.random() - .5) * 8,

            life: 30

        });

    }
}


function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        let p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

        if (p.life <= 0)
            particles.splice(i, 1);
    }
}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GROUND */

    ctx.fillStyle = "#263b2a";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle =
        "rgba(255,255,255,.04)";

    for (
        let x = 0;
        x < canvas.width;
        x += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();
    }


    for (
        let y = 0;
        y < canvas.height;
        y += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();
    }


    /* OBSTACLES */

    ctx.fillStyle = "#38483a";

    for (let i = 0; i < 8; i++) {

        let x =
            (i * 317) %
            Math.max(canvas.width - 120, 1);

        let y =
            130 +
            (i * 149) %
            Math.max(canvas.height - 220, 1);


        ctx.fillRect(
            x,
            y,
            100,
            35
        );
    }


    /* ENEMIES */

    for (let enemy of enemies) {

        ctx.fillStyle = "#c62828";

        ctx.beginPath();

        ctx.arc(
            enemy.x,
            enemy.y,
            enemy.size,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* BOT HEAD */

        ctx.fillStyle = "#222";

        ctx.fillRect(
            enemy.x - 12,
            enemy.y - 25,
            24,
            8
        );


        /* GUN */

        ctx.strokeStyle = "#111";

        ctx.lineWidth = 7;

        ctx.beginPath();

        ctx.moveTo(
            enemy.x,
            enemy.y
        );

        ctx.lineTo(
            enemy.x + 28,
            enemy.y
        );

        ctx.stroke();
    }


    /* PLAYER */

    ctx.fillStyle = "#35c759";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.size,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* PLAYER GUN */

    ctx.strokeStyle = "#111";

    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y
    );

    ctx.lineTo(
        player.x + 35,
        player.y
    );

    ctx.stroke();


    /* BULLETS */

    for (let bullet of bullets) {

        ctx.fillStyle =
            bullet.enemyBullet
            ? "#ff5252"
            : "#fff36b";


        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            5,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* EXPLOSIONS */

    for (let p of particles) {

        ctx.fillStyle =
            "rgba(255,180,40," +
            p.life / 30 +
            ")";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            5,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (!gameRunning)
        return;

    update();

    draw();

    animation =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================
   HEALTH
========================= */

function updateHealth() {

    document
        .getElementById("health")
        .style.width =
        Math.max(health, 0) + "%";
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    gameRunning = false;

    cancelAnimationFrame(animation);

    document
        .getElementById("finalScore")
        .innerText = score;

    document
        .getElementById("game")
        .classList.remove("active");

    document
        .getElementById("gameOver")
        .classList.add("active");
}


/* =========================
   MENU
========================= */

function goMenu() {

    gameRunning = false;

    cancelAnimationFrame(animation);

    document
        .getElementById("gameOver")
        .classList.remove("active");

    document
        .getElementById("menu")
        .classList.add("active");
}

</script>

</body>
</html>
